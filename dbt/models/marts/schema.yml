version: 2

models:
  - name: dim_customer
    description: "Customer dimension, 1:1 from stg_customers."
    columns:
      - name: customer_id
        description: "Surrogate/primary key of a customer."
        tests:
          - unique
          - not_null
      - name: customer_name
        description: "Customer full name."
        tests:
          - not_null
      - name: phone
        description: "Customer phone number."
      - name: email
        description: "Customer email address."
      - name: gender
        description: "Customer gender (male/female)."
      - name: city
        description: "Customer city."
      - name: created_at
        description: "Timestamp the customer record was created."

  - name: dim_product
    description: "Product dimension, 1:1 from stg_products."
    columns:
      - name: product_id
        description: "Primary key of a product."
        tests:
          - unique
          - not_null
      - name: product_name
        description: "Product name."
        tests:
          - not_null
      - name: category
        description: "Product category."
      - name: brand
        description: "Product brand."
      - name: unit_price
        description: "Current unit price of the product."
        tests:
          - not_null
      - name: is_active
        description: "Whether the product is currently sellable."
      - name: created_at
        description: "Timestamp the product record was created."

  - name: dim_date
    description: "Date dimension generated from the min/max transaction_date range in stg_transactions."
    columns:
      - name: date_id
        description: "Surrogate key in YYYYMMDD integer format."
        tests:
          - unique
          - not_null
      - name: date
        description: "Calendar date."
        tests:
          - not_null
      - name: year
        description: "Calendar year."
      - name: quarter
        description: "Calendar quarter (1-4)."
      - name: month
        description: "Calendar month number (1-12)."
      - name: month_name
        description: "Full month name."
      - name: day_of_month
        description: "Day of month (1-31)."
      - name: day_of_week
        description: "ISO day of week (1=Monday, 7=Sunday)."
      - name: day_name
        description: "Full day name."
      - name: iso_week
        description: "ISO week number of the year."
      - name: is_weekend
        description: "True if the date falls on Saturday or Sunday."

  - name: fact_sales
    description: "Grain: one row per transaction item. Combines stg_transactions and stg_transaction_items into the sales fact table."
    columns:
      - name: item_id
        description: "Primary key, one row per transaction item."
        tests:
          - unique
          - not_null
      - name: transaction_id
        description: "FK to the parent transaction."
        tests:
          - not_null
      - name: customer_id
        description: "FK to dim_customer."
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: product_id
        description: "FK to dim_product."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: date_id
        description: "FK to dim_date, derived from transaction_date."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id
      - name: store_id
        description: "Raw store identifier (1-3), no store dimension at this level."
      - name: transaction_date
        description: "Timestamp the transaction occurred."
        tests:
          - not_null
      - name: payment_method
        description: "Payment method used (cash, debit, credit, e-wallet)."
      - name: quantity
        description: "Quantity sold."
        tests:
          - not_null
      - name: unit_price
        description: "Unit price at time of sale."
        tests:
          - not_null
      - name: discount
        description: "Discount percentage applied."
      - name: subtotal
        description: "Line subtotal after discount."
        tests:
          - not_null
